name: ZXP Release

# NOTE: this file was renamed from main.yml to force GitHub to re-register the
# workflow — the original registration was corrupted (every push spawned a
# phantom "BuildFailed" run and the real workflow never triggered).

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm i --legacy-peer-deps

      - name: Fetch ZXPSignCmd
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/x64/ZXPSignCmd.exe" -OutFile "tools/ZXPSignCmd.exe"
          Add-Content $env:GITHUB_PATH "$PWD\tools"

      - run: npm run zxp
        env:
          # optional repo secret; the build falls back to a throwaway
          # self-sign password when unset
          ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "./dist/zxp/*"
